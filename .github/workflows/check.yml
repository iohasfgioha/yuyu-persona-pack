name: Check package
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      ASTRBOT_SOURCE: ${{ github.workspace }}/.upstream
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: AstrBotDevs/AstrBot
          ref: abf683071952375ec36baa4cad6b6f3d9c9bb03f
          path: .upstream
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python tools/manage.py check
      - run: python tools/build_pack.py
      - run: git diff --exit-code -- SHA256SUMS.json
